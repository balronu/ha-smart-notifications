name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip 'pytest<9' pytest-homeassistant-custom-component ruff voluptuous homeassistant==2026.10.2
      - run: pytest -q
      - run: ruff check .
      - run: python -m compileall -q custom_components
      - run: python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text())
          print('JSON valid')
        PY
      - uses: hacs/action@main
