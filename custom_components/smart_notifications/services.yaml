send:
  name: Nachricht senden
  description: Sendet den zentralen Text eines Ereignisses an die konfigurierten Ausgabegeräte.
  fields:
    reason:
      name: Ereignis
      description: Schlüssel des Ereignisses aus dem Ereigniskatalog.
      required: true
      selector: {text: {}}
    context:
      name: Kontext
      required: false
      selector: {object: {}}
    event_key:
      name: Eindeutiger Ereignisschlüssel
      required: false
      selector: {text: {}}
test_device:
  name: Gerät testen
  description: Sendet nur nach ausdrücklicher Bestätigung eine Testnachricht an ein konfiguriertes Gerät.
  fields:
    device_id:
      name: Gerät
      required: true
      selector: {text: {}}
    message:
      name: Testnachricht
      required: false
      selector: {text: {}}
    confirm:
      name: Bestätigung
      required: true
      selector: {boolean: {}}
test_event:
  name: Ereignis testen
  description: Führt nur nach ausdrücklicher Bestätigung die konfigurierten Ausgaben eines Ereignisses aus.
  fields:
    reason:
      name: Ereignis
      required: true
      selector: {text: {}}
    confirm:
      name: Bestätigung
      required: true
      selector: {boolean: {}}
